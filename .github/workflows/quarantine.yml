name: quarantine

# Every skill version reaches the market the same way, through one pull request that a person merges:
#   - daily (and on demand) every skill in quarantine/ moves to its repository's newest release tag;
#   - a merged request (a push to main that changes quarantine/) brings new skills.
# Each unchecked version is then fetched, license-checked and scanned in a job of its own. A version that clears
# is copied into approved/; one that doesn't stays in quarantine, held at the gate (gate/ keeps its findings, never
# its files), and the version already in the market keeps being served. The bumps and the records go into one PR
# (branch bot/admit) for a person to review and merge once CI passes; the merge deploys the site (deploy.yml).
# Request PRs get the same checks, read-only, so the verdict shows before anyone merges them.
#
# Setup: a GitHub App with contents and pull-requests write, installed on this repository (its client id in the
# variable MARKTPLATZ_APP_CLIENT_ID, its private key in the secret MARKTPLATZ_APP_PRIVATE_KEY), and a ruleset on
# main that requires the ci check. The App opens the PR because events caused by GITHUB_TOKEN start no workflows:
# CI would never run on it.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths: [quarantine/**]
  pull_request:
    paths: [quarantine/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: quarantine-${{ github.event_name == 'pull_request' && github.ref || 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.plan.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Look for new releases
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun scripts/quarantine.ts updates
      - id: plan
        run: echo "skills=$(bun scripts/quarantine.ts plan)" >> "$GITHUB_OUTPUT"
      # The later jobs check exactly these manifests, even if a new tag appears meanwhile.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifests
          path: quarantine
          retention-days: 7

  check:
    needs: plan
    if: needs.plan.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        skill: ${{ fromJSON(needs.plan.outputs.skills) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests
          path: quarantine
      - name: Fetch, license, scan
        run: bun scripts/quarantine.ts check "$SKILL"
        env:
          SKILL: ${{ matrix.skill }}
      - name: Job summary
        if: always()
        run: cat ".quarantine/$SKILL/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        env:
          SKILL: ${{ matrix.skill }}
      # Blocked skills too: their findings are published under gate/. The artifact holds .quarantine/ (only this
      # skill's folder), so it unpacks as <id>/ however many skills admit downloads.
      - if: always() && hashFiles(format('.quarantine/{0}/scan/summary.json', matrix.skill)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-${{ matrix.skill }}
          path: .quarantine
          include-hidden-files: true
          retention-days: 7

  admit:
    needs: [plan, check]
    # Runs even if some skills were blocked or failed; every skill that got as far as the scan has an artifact.
    if: always() && github.event_name != 'pull_request' && needs.plan.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MARKTPLATZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.MARKTPLATZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifests
          path: quarantine
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: skill-*
          path: .quarantine
          merge-multiple: true
      - name: Record every verdict and open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          BRANCH: bot/admit
        run: |
          user_id="$(gh api "/users/$APP%5Bbot%5D" --jq .id)"
          git config user.name "${APP}[bot]"
          git config user.email "${user_id}+${APP}[bot]@users.noreply.github.com"
          git switch --quiet -C "$BRANCH"

          # A new release that could not be fetched or license-checked stays out; its manifest keeps the version it had.
          for file in $(git diff --name-only -- quarantine/); do
            id="$(basename "$file" .yaml)"
            [ -d ".quarantine/$id" ] || git checkout -- "$file"
          done

          cleared=0; held=0; body=""
          shopt -s nullglob
          for dir in .quarantine/*/; do
            id="$(basename "$dir")"
            bun scripts/promote.ts "$id"
            if [ "$(jq -r .passed ".quarantine/$id/scan/summary.json")" = true ]; then cleared=$((cleared + 1)); else held=$((held + 1)); fi
            body+="$(cat ".quarantine/$id/report.md")"$'\n\n'
          done
          bun scripts/verify.ts
          # GitHub caps a PR body at 65536 characters; every full report is also in this run's job summaries.
          if [ "${#body}" -gt 60000 ]; then body="${body:0:60000}"$'\n\n… cut short; every report is in the job summaries of the run.'; fi

          git add quarantine approved gate
          if git diff --cached --quiet; then echo "Nothing to admit."; exit 0; fi
          title="Admit skills: $cleared cleared, $held held at the gate"
          git commit --quiet -m "$title"
          git push --force origin "$BRANCH"

          printf '%s\n' "Checked by the quarantine workflow: cleared versions go to approved/, the rest stay in quarantine with their findings in gate/. Review and merge it once CI passes." "" "$body" > body.md
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md
          fi
